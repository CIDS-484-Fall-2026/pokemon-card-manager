
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Pokémon Collection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #15191f;
            color: white;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #aaaaaa;
        }

        .collection {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background-color: #252c35;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #3c4652;
        }

        .card h2 {
            margin-top: 0;
            color: #f5d76e;
        }

        .card p {
            color: #dddddd;
        }

        .empty-message {
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<h1>My Pokémon Collection</h1>
<p class="subtitle">Manage and explore your Pokémon cards</p>

<div class="empty-message" th:if="${#lists.isEmpty(cards)}">
    <p>Your collection is currently empty.</p>
</div>

<div class="collection">
    <div class="card" th:each="card : ${cards}">
        <h2 th:text="${card.name}">Pokémon Name</h2>
        <p>Set: <span th:text="${card.setName}">Set Name</span></p>
        <p>Number: <span th:text="${card.cardNumber}">Card Number</span></p>
        <p>Rarity: <span th:text="${card.rarity}">Rarity</span></p>
    </div>
</div>

</body>
</html>
